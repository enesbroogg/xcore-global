<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X-CORE v8.0 | OPERATOR SCANNER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #7d5fff; --bg: #020205; --side: #08080c; --g: #00ff88; --r: #ff4757; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; }
        #matrix-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

        /* NEON BUTON */
        .neon-btn { position: relative; padding: 15px; color: #fff; background: #000; text-transform: uppercase; letter-spacing: 2px; font-size: 13px; font-family: 'Orbitron'; overflow: hidden; border: 1px solid rgba(125,95,255,0.3); cursor: pointer; display: block; width: 100%; margin: 15px 0; }
        .neon-btn span { position: absolute; display: block; }
        .neon-btn span:nth-child(1) { top: 0; left: -100%; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--p)); animation: btn1 2s linear infinite; }
        @keyframes btn1 { 0% { left: -100%; } 50%,100% { left: 100%; } }

        /* AUTH GATE */
        .auth-gate { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin: 5px 0; width: 100%; border-radius: 5px; outline: none; }

        /* LAYOUT */
        .container { display: flex; width: 100vw; height: 100vh; }
        .sidebar { width: 250px; background: var(--side); border-right: 1px solid #1a1a25; padding: 20px; display: flex; flex-direction: column; }
        .main { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: rgba(10,10,20,0.9); border: 1px solid #1a1a25; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-top: 3px solid var(--p); }

        /* OPERATOR SCANNER */
        #scan-box { display: none; background: #000; padding: 10px; border-radius: 5px; margin-top: 10px; font-family: monospace; font-size: 12px; color: var(--g); border: 1px dashed var(--g); }
        .op-found { color: var(--g); font-weight: bold; margin-top: 5px; display: none; }

        .nav-item { padding: 15px; margin: 5px 0; cursor: pointer; color: #888; border-radius: 8px; }
        .nav-active { background: rgba(125,95,255,0.1); color: #fff; border-right: 3px solid var(--p); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* LOG TABLE */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #222; padding: 10px; text-align: left; }
        th { background: #111; color: var(--p); }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div class="auth-gate" id="auth-gate">
    <div style="position:absolute; top:20px; right:20px; cursor:pointer; color:var(--p)" onclick="adminLogin()">ROOT ACCESS</div>
    <div id="login-box" style="width: 85%; max-width: 350px; text-align: center;">
        <h2 style="font-family:'Orbitron'; color:var(--p);">X-CORE V8</h2>
        <input type="text" id="u_name" placeholder="Kullanıcı Adı">
        <button class="neon-btn" onclick="userLogin()"><span></span>GİRİŞ YAP</button>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <h3 style="font-family:'Orbitron'; color:var(--p); text-align:center;">X-CORE</h3>
        <div class="nav-item nav-active" onclick="switchTab('home', this)">🏠 Panel</div>
        <div class="nav-item" onclick="switchTab('vatan', this)">📞 Beni Ara</div>
        <div id="admin-nav" class="nav-item" style="display:none; color:var(--g)" onclick="switchTab('admin', this)">⚙️ Admin Log</div>
        <div class="nav-item" onclick="location.reload()" style="margin-top:auto; color:var(--r)">🔒 Çıkış</div>
    </div>

    <div class="main">
        <div id="tab-home" class="tab-content active">
            <div class="card"><h2>SİSTEM AKTİF</h2><p>Hoş geldin <span id="display-user"></span>. Operatör tarayıcı modülü ve Admin Log entegrasyonu tamamlandı.</p></div>
        </div>

        <div id="tab-vatan" class="tab-content">
            <div class="card" style="background:#fff; color:#333;">
                <h3 style="color:#004a99; border-bottom:2px solid #004a99">VATANSMS - BENİ ARA</h3>
                <input type="text" id="v_ad" placeholder="Ad Soyad" style="background:#f4f4f4; color:#333;">
                <input type="number" id="v_tel" placeholder="Telefon (5xx...)" oninput="startScan(this.value)" style="background:#f4f4f4; color:#333;">
                
                <div id="scan-box"></div>
                <div id="op-result" class="op-found">✅ Operatör Tespit Edildi: <span id="detected-op"></span></div>
                
                <button onclick="finalSend()" class="neon-btn" style="background:#004a99; margin-top:20px;"><span></span>TALEBİ GÖNDER</button>
            </div>
        </div>

        <div id="tab-admin" class="tab-content">
            <div class="card">
                <h2 style="color:var(--g)">YÖNETİCİ LOG KAYITLARI</h2>
                <table>
                    <thead><tr><th>Kullanıcı</th><th>Hedef No</th><th>Operatör</th><th>Durum</th></tr></thead>
                    <tbody id="log-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let logs = JSON.parse(localStorage.getItem('xcore_logs')) || [];

    function userLogin() {
        currentUser = document.getElementById('u_name').value;
        if(currentUser) {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('display-user').innerText = currentUser;
        }
    }

    function adminLogin() {
        const p = prompt("Root Password:");
        if(p === 'Yalova77!Siber') {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('admin-nav').style.display = 'block';
            updateLogTable();
            alert("Admin Yetkisi Aktif.");
        }
    }

    function startScan(val) {
        if(val.length >= 3) {
            const scanBox = document.getElementById('scan-box');
            const opResult = document.getElementById('op-result');
            scanBox.style.display = 'block';
            opResult.style.display = 'none';
            
            const ops = ["VODAFONE TR...", "TURK TELEKOM...", "TURKCELL...", "BIMCELL...", "PttCELL..."];
            let i = 0;
            let timer = setInterval(() => {
                scanBox.innerText = "TARANIYOR: " + ops[i % ops.length];
                i++;
                if(i > 15) {
                    clearInterval(timer);
                    scanBox.style.display = 'none';
                    showOp(val);
                }
            }, 50);
        }
    }

    function showOp(val) {
        let op = "BİLİNMİYOR";
        if(val.startsWith('53')) op = "TURKCELL";
        else if(val.startsWith('54')) op = "VODAFONE";
        else if(val.startsWith('50') || val.startsWith('55')) op = "TURK TELEKOM";
        
        document.getElementById('detected-op').innerText = op;
        document.getElementById('op-result').style.display = 'block';
    }

    function finalSend() {
        const ad = document.getElementById('v_ad').value;
        const tel = document.getElementById('v_tel').value;
        const op = document.getElementById('detected-op').innerText;

        if(ad && tel) {
            // Log Kaydet
            const newLog = { user: currentUser, target: tel, operator: op, status: "BEKLEMEDE" };
            logs.push(newLog);
            localStorage.setItem('xcore_logs', JSON.stringify(logs));
            
            alert("SAYIN " + ad.toUpperCase() + ",\n\nTalebiniz Vatansms havuzuna iletildi. Sistem sizi " + op + " hattınız üzerinden en kısa sürede arayacaktır.\n\nDurum: YÖNLENDİRİLİYOR...");
            
            document.getElementById('v_ad').value = "";
            document.getElementById('v_tel').value = "";
            document.getElementById('op-result').style.display = 'none';
        }
    }

    function updateLogTable() {
        const tbody = document.getElementById('log-table-body');
        tbody.innerHTML = "";
        logs.reverse().forEach(log => {
            tbody.innerHTML += `<tr><td>${log.user}</td><td>${log.target}</td><td>${log.operator}</td><td style="color:orange">${log.status}</td></tr>`;
        });
    }

    function switchTab(t, el) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-active'));
        el.classList.add('nav-active');
    }

    // Matrix Background
    const canvas = document.getElementById('matrix-bg'); const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    setInterval(() => {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#0F0"; ctx.font = "15px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*16, y*16);
            if(y*16 > canvas.height && Math.random() > 0.98) drops[i] = 0; drops[i]++;
        });
    }, 50);
</script>
</body>
</html>
